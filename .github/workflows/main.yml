name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.pytest }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest: [pytestlatest]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            pytest: pytestmin
          - os: macos-latest
            python-version: "3.15"
            pytest: pytestlatest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install 'tox>=4.65,<5'
      - name: Test installed wheel
        run: python -m tox -e py-${{ matrix.pytest }}

  checks:
    name: Lint, types, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install 'tox>=4.65,<5'
      - name: Check style, types, and distributions
        run: python -m tox -e lint,type,package
