repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: checks
        name: Types and tests
        entry: uv run --locked tox -e type,py
        language: unsupported
        pass_filenames: false
        always_run: true
