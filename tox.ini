# Based on pytest-dev/cookiecutter-pytest-plugin; test installed wheels.
[tox]
requires = tox>=4.22
env_list = py311-pytestmin, py{311,312,313,314,315}-pytestlatest, lint, package

[testenv]
package = wheel
deps =
    pytestmin: pytest==8.4.2
    pytestlatest: pytest>=8.4.2,<10
    pytest-xdist==3.8.0
    pytest-asyncio==1.3.0
commands = python -m pytest {posargs:tests}

[testenv:lint]
description = Check source and test style with the template's Flake8 setup
skip_install = true
deps = flake8>=7,<8
commands = python -m flake8 src tests

[testenv:package]
description = Build a source distribution and a wheel from it, then validate metadata
skip_install = true
deps =
    build>=1.2,<2
    twine>=6,<7
commands =
    python -m build --outdir {env_tmp_dir}/dist
    python -m twine check --strict {env_tmp_dir}/dist/*

[flake8]
max-line-length = 120
# Preserve the existing formatter-compatible slice spacing.
extend-ignore = E203
